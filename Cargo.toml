[package]
name = "hakomcp"
version = "0.2.0"
edition = "2021"
description = "Thin MCP server for the HakoDB embedded document engine"
license = "MIT"
repository = "https://github.com/hakodb/hakomcp"
homepage = "https://github.com/hakodb/hakomcp"
readme = "README.md"
keywords = ["mcp", "hakodb", "database", "embedded", "vector"]
categories = ["database", "command-line-utilities"]

[features]
default = ["net-sync", "cloud-sync"]
net-sync = ["hakodb/net-sync"]
cloud-sync = ["hakodb/cloud-sync"]

[dependencies]
# Core engine plus the optional mesh/cloud transport planes. The features
# above forward to hakodb, so `--no-default-features` still builds a
# local-only binary.
hakodb = { version = "0.17.1", default-features = false }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
