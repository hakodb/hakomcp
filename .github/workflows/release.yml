name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hakomcp
            binary: hakomcp
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hakomcp-macos-aarch64
            binary: hakomcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: hakomcp.exe
            binary: hakomcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

      # Artifact names are the published asset names. Two targets both build
      # a file called `hakomcp`, so copy to the distinct asset name first:
      # upload-artifact would otherwise collapse them in the merged download.
      - name: Collect binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
